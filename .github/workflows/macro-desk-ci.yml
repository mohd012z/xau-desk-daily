name: MACRO DESK CI

on:
  push:
    paths:
      - 'macro/**'
      - 'macro-preview.html'
      - 'tests/js/**'
      - '.github/workflows/macro-desk-ci.yml'
  pull_request:
    paths:
      - 'macro/**'
      - 'macro-preview.html'
      - 'tests/js/**'
      - '.github/workflows/macro-desk-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run MACRO DESK tests
        run: node --test tests/js/*.test.mjs

      - name: Check JavaScript syntax
        run: |
          node --check macro/core/instruments.mjs
          node --check macro/core/events.mjs
          node --check macro/core/reaction.mjs
          node --check macro/core/feed-status.mjs
          node --check macro/adapters/snapshot-adapter.mjs
          node --check macro/adapters/event-feed-adapter.mjs
          node --check macro/events/event-record.mjs
          node --check macro/events/affected-assets.mjs
          node --check macro/events/detector.mjs
          node --check macro/events/speech.mjs
          node --check macro/events/event-store.mjs
          node --check macro/events/recalculate.mjs
          node --check macro/ui/app.mjs
