name: MACRO DESK Phase 3 CI
on:
  workflow_dispatch:
  push:
    branches: [main, feature/phase3-myt-trade-plan]
    paths:
      - 'macro/**'
      - 'tests/js/**'
      - '.github/workflows/macro-phase3-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JavaScript tests
        run: node --test tests/js/*.test.mjs
      - name: Syntax check Phase 3 modules
        run: |
          node --check macro/core/time-myt.mjs
          node --check macro/core/distribution.mjs
          node --check macro/core/plan-quality.mjs
          node --check macro/core/pivot-target.mjs
          node --check macro/events/trade-plan.mjs
          node --check macro/events/trade-plan-revisions.mjs
          node --check macro/ui/trade-plan-view.mjs
          node --check macro/ui/trade-plan-controller.mjs
      - name: Public-source safety checks
        run: |
          ! grep -R -E 'apikey=[A-Za-z0-9_-]{8,}|TWELVE_DATA_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}|NEWS_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}|FRED_API_KEY[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{8,}' macro
          ! grep -R -E 'BUY setup|SELL setup|Stop loss|Take profit' macro/events macro/ui/trade-plan-*.mjs