name: Deploy XAU DESK to GitHub Pages

on:
  workflow_dispatch:

  # Deploy when you manually edit the website/data.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'xauusd-data.js'
      - 'macro-preview.html'
      - 'macro/**'
      - 'data/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'

  # IMPORTANT:
  # GITHUB_TOKEN commits from the daily updater do not normally
  # start another push workflow.
  #
  # workflow_run solves that problem.
  workflow_run:
    workflows:
      - "XAUUSD Daily Verified Snapshot"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-xau-desk
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy XAU DESK

    # For workflow_run, deploy only when the updater succeeded.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp xauusd-data.js _site/xauusd-data.js

          if [ -f "macro-preview.html" ]; then
            cp macro-preview.html _site/macro-preview.html
          fi

          if [ -d "macro" ]; then
            cp -R macro _site/macro
          fi

          if [ -d "data" ]; then
            cp -R data _site/data
          fi

          if [ -f ".nojekyll" ]; then
            cp .nojekyll _site/.nojekyll
          else
            touch _site/.nojekyll
          fi

          echo "Files prepared:"
          find _site -maxdepth 3 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "===================================="
          echo "XAU DESK + MACRO DESK PREVIEW DEPLOYED"
          echo "===================================="
          echo "Branch : main"
          echo "Home   : index.html"
          echo "Preview: macro-preview.html"
          echo "Data   : xauusd-data.js + data/event-history.json"
          echo "===================================="
