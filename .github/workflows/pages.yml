name: Deploy XAU DESK to GitHub Pages

on:
  workflow_dispatch:

  # Deploy when you manually edit the website/data.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'xauusd-data.js'
      - 'macro-preview.html'
      - 'macro/**'
      - 'data/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'

  # IMPORTANT:
  # GITHUB_TOKEN commits from the daily updater do not normally
  # start another push workflow.
  #
  # workflow_run solves that problem.
  workflow_run:
    workflows:
      - "XAUUSD Daily Verified Snapshot"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-xau-desk
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy XAU DESK

    # For workflow_run, deploy only when the updater succeeded.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp xauusd-data.js _site/xauusd-data.js

          if [ -f "macro-preview.html" ]; then
            cp macro-preview.html _site/macro-preview.html
          fi

          if [ -d "macro" ]; then
            cp -R macro _site/macro
          fi

          if [ -d "data" ]; then
            cp -R data _site/data
          fi

          # The legacy source still contains an old embedded snapshot for local
          # compatibility. Inject the fail-closed guard immediately before the
          # legacy renderer so a missing xauusd-data.js can never present that
          # stale market content as current data.
          python - <<'PY'
          from pathlib import Path

          page = Path("_site/index.html")
          text = page.read_text(encoding="utf-8")
          guard = '<script src="./macro/ui/runtime-safety.js"></script>'
          needle = 'var D = window.XAUUSD_DATA || window.XAUUSD_EMBEDDED;'

          if guard not in text:
              renderer_pos = text.find(needle)
              if renderer_pos < 0:
                  raise SystemExit("Legacy renderer marker not found; refusing unsafe Pages build")
              script_pos = text.rfind("<script", 0, renderer_pos)
              if script_pos < 0:
                  raise SystemExit("Legacy renderer script start not found; refusing unsafe Pages build")
              text = text[:script_pos] + guard + "\n  " + text[script_pos:]
              page.write_text(text, encoding="utf-8")

          if 'window.XAUUSD_EMBEDDED' not in text or guard not in text:
              raise SystemExit("Runtime safety wiring validation failed")
          PY

          if [ -f ".nojekyll" ]; then
            cp .nojekyll _site/.nojekyll
          else
            touch _site/.nojekyll
          fi

          echo "Files prepared:"
          find _site -maxdepth 3 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "===================================="
          echo "XAU DESK + MACRO DESK PREVIEW DEPLOYED"
          echo "===================================="
          echo "Branch : main"
          echo "Home   : index.html"
          echo "Preview: macro-preview.html"
          echo "Data   : xauusd-data.js + data/event-history.json"
          echo "Safety : macro/ui/runtime-safety.js injected before legacy renderer"
          echo "===================================="
